<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nomad Zohaib · TikTok connected</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f6f1e8;font-family:Georgia,serif;text-align:center;padding:24px}
  .card{max-width:560px}
  img{width:96px;border-radius:50%;margin-bottom:18px}
  h1{font-weight:400;font-size:34px;margin:0 0 10px}
  p{color:#bdb5a7;font-family:system-ui,sans-serif;line-height:1.6}
  code{display:block;word-break:break-all;background:#16161a;border:1px solid rgba(242,210,156,.3);border-radius:12px;padding:16px;margin:18px 0;font-size:15px;color:#f2d29c}
  button{font:600 14px system-ui;letter-spacing:.12em;background:#d9b273;color:#0b0b0d;border:0;border-radius:999px;padding:14px 26px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <img src="media/logo_512.png" alt="Nomad Zohaib">
  <h1 id="t">TikTok connected</h1>
  <p id="m">Copy this code and paste it into the window on your computer that asks for it.</p>
  <code id="c">…</code>
  <button id="b" type="button">COPY CODE</button>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error_description") || q.get("error");
  if (code && q.get("state") === "studio") { location.replace("/studio/?code=" + encodeURIComponent(code)); }   // sign-in started from the Studio screen
  if (code) { document.getElementById("c").textContent = code; }
  else {
    document.getElementById("t").textContent = err ? "Not connected" : "Nothing to show";
    document.getElementById("m").textContent = err ? "TikTok said: " + err : "This page is only used when connecting TikTok.";
    document.getElementById("c").remove(); document.getElementById("b").remove();
  }
  document.getElementById("b")?.addEventListener("click", async e => {
    try { await navigator.clipboard.writeText(code); e.target.textContent = "COPIED ✓"; } catch { e.target.textContent = "SELECT AND COPY THE CODE ABOVE"; }
  });
</script>
</body>
</html>
