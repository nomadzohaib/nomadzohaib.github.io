name: Sync YouTube videos

on:
  schedule:
    - cron: "17 */3 * * *"     # every 3 hours
  workflow_dispatch:            # "Run workflow" button for an instant sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest videos from YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/sync.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet videos.json; then
            echo "No changes"
          else
            git config user.name "nomadzohaib-bot"
            git config user.email "nomadzohaib-bot@users.noreply.github.com"
            git add videos.json
            git commit -m "Auto-sync: new YouTube videos"
            git push
          fi
